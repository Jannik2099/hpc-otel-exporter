services:
  mimir:
    image: docker.io/grafana/mimir:latest
    command:
      - -config.file=/etc/mimir/mimir.yaml
    volumes:
      - ./docker/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro

  pyroscope:
    image: docker.io/grafana/pyroscope:latest
    ports:
      - "4040:4040"
    command:
      - -config.file=/etc/pyroscope/pyroscope.yaml
    volumes:
      - ./docker/pyroscope/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro

  tempo:
    image: docker.io/grafana/tempo:latest
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  loki:
    image: docker.io/grafana/loki:latest
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro

  grafana:
    image: docker.io/grafana/grafana:latest
    depends_on:
      - mimir
      - pyroscope
      - tempo
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-llm-app # Profiles Drilldown tries to look for this
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

  alloy:
    image: docker.io/grafana/alloy:latest
    depends_on:
      - mimir
      - tempo
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
