[package]
name = "hpc-otel-exporter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.101"
dashmap = { version = "6.1.0", features = ["inline"] }
env_logger = "0.11"
libbpf-rs = "0.26.0"
libbpf-sys = "1.6.3"
libc = "0.2"
log = "0.4"
opentelemetry = { version = "0.32", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "metrics",
    "trace",
    "logs",
    "grpc-tonic",
    "tls-roots",
] }
opentelemetry_sdk = { version = "0.32", features = [
    "metrics",
    "trace",
    "logs",
    "experimental_metrics_bound_instruments",
] }
opentelemetry-appender-log = "0.32"
tracing-opentelemetry = "0.33.0"
rustc-hash = "2"
tokio = { version = "1.48", features = ["full"] }
pyroscope = { version = "2.0.3", features = [
    "backend-pprof-rs",
], optional = true }
clap = { version = "4.6.1", features = ["derive"] }
blazesym = { version = "0.2.4", features = [
    "xz",
    "zstd",
    "tracing",
], git = "https://github.com/libbpf/blazesym.git", rev = "d120cd5dd7ef99db6f7ca8dea4c4ed25f650b640" }
prost = "0.14.3"
reqwest = { version = "0.13", default-features = false }
flate2 = "1"
uuid = { version = "1", features = ["v7"] }
lru = "0.18.0"
# DWARF .eh_frame parsing for the in-kernel native-stack unwinder. Versions are
# pinned to what blazesym already pulls in so we reuse the compiled artifacts.
gimli = { version = "0.32", default-features = false, features = [
    "read",
    "std",
] }
object = { version = "0.37", default-features = false, features = [
    "read",
    "std",
] }
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mimalloc = { version = "0.1.52", optional = true }

[features]
default = ["mimalloc"]

pyroscope = ["dep:pyroscope"]
mimalloc = ["dep:mimalloc"]

[build-dependencies]
libbpf-cargo = "0.26.0"
serde_json = "1.0.149"
bindgen = "0.72.1"
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"

[profile.release]
lto = "thin"
opt-level = 3
debug = "line-tables-only"
